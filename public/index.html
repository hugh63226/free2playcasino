const Auth=(()=>{
 let user=null,rev=0,timer=null,dirty=false,inflight=false,retry=0,status="saved",lastSaved=0,conflict=false;
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const CACHE=()=>"casino-cache:"+user;
 const USER_RE=/^[A-Za-z0-9_-]{3,20}$/;

 async function api(path,method="GET",body){
  try{
   const r=await fetch("/api/"+path,{method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},
    body:body?JSON.stringify(body):undefined,keepalive:method==="PUT"});
   let d={};try{d=await r.json()}catch(e){}
   return{ok:r.ok,status:r.status,d}
  }catch(e){return{ok:false,status:0,d:{error:"Can't reach the server. Check your connection and try again."}}}
 }

 /* ---- sync status shown on the account button ---- */
 const LABEL={saved:"☁ Saved",saving:"☁ Saving…",offline:"⚠ Offline - retrying",conflict:"⚠ Sync paused"};
 const btn=()=>user?`<button class="btn" id="acctbtn" style="margin-top:6px;padding:4px 10px;font-size:12px;display:block" onclick="Auth.menu()">👤 ${esc(user)} · ${LABEL[status]}</button>`:"";
 const upd=()=>{const b=$("acctbtn");if(b)b.innerHTML=`👤 ${esc(user)} · ${LABEL[status]}`};

 /* ---- cloud saving (debounced; local copy kept as a crash backup) ---- */
 function queue(){
  if(!user)return;
  try{localStorage.setItem(CACHE(),JSON.stringify(S))}catch(e){}
  dirty=true;status=conflict?"conflict":"saving";upd();
  clearTimeout(timer);timer=setTimeout(flush,1500);
 }
 async function flush(){
  if(!user||!dirty||conflict)return;
  if(inflight){clearTimeout(timer);timer=setTimeout(flush,400);return}
  inflight=true;dirty=false;
  const r=await api("save","PUT",{save:S,rev});
  inflight=false;
  if(r.ok){rev=r.d.rev;retry=0;lastSaved=Date.now();status=dirty?"saving":"saved";upd();if(dirty){clearTimeout(timer);timer=setTimeout(flush,800)}}
  else if(r.status===409){conflict=true;dirty=true;status="conflict";upd();await resolveConflict(r.d)}
  else if(r.status===401){dirty=true;status="offline";upd();await ask(["Your session expired, so your latest progress isn't synced yet.","Log in again - the progress kept on this device will be offered back to you."]);location.reload()}
  else{dirty=true;status="offline";upd();retry=Math.min(retry+1,5);clearTimeout(timer);timer=setTimeout(flush,Math.min(30000,2000*2**retry))}
 }
 async function drain(){clearTimeout(timer);for(let i=0;i<40&&(dirty||inflight);i++){if(inflight)await sleep(150);else await flush()}}
 async function resolveConflict(d){
  const v=await ask(["<b>This account was saved somewhere else more recently</b> (another device or browser tab).",
   "Load that newer cloud save, or overwrite it with the progress on this screen?"],
   [["cloud","Load cloud save"],["mine","Keep this progress"]]);
  if(v==="cloud"&&d.save){S=Object.assign(DEFAULT(),d.save);shown=S.money;rev=d.rev;dirty=false;conflict=false;status="saved";try{localStorage.setItem(CACHE(),JSON.stringify(S))}catch(e){}view={v:"lobby"};render()}
  else{rev=d.rev;conflict=false;dirty=true;status="saving";upd();flush()}
 }
 document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
 addEventListener("pagehide",()=>{flush()});

 async function loadSave(isNew){
  let r;
  for(;;){
   r=await api("save");
   if(r.ok)break;
   if(r.status===401){location.reload();return}
   await ask([`Couldn't load your saved game: ${esc(r.d.error||"server error")}`],[["retry","Try again"]]);
  }
  rev=r.d.rev||0;
  if(r.d.save){S=Object.assign(DEFAULT(),r.d.save)}
  else{
   S=DEFAULT();
   try{
    const l=JSON.parse(localStorage.getItem(KEY)||"null");
    if(l&&l.games_played>0&&await ask([`Found game progress saved on this device (${fmt(Math.floor(l.money))}, ${l.games_played} games played).`,"Move it into your new account?"],[["y","Yes, import it"],["n","No, start fresh"]])==="y"){
     S=Object.assign(DEFAULT(),l);localStorage.setItem(KEY+"-imported",localStorage.getItem(KEY));localStorage.removeItem(KEY)}
   }catch(e){}
   dirty=true;await flush();
  }
  // unsynced progress left on this device by a crash / lost connection?
  try{
   const c=JSON.parse(localStorage.getItem(CACHE())||"null");
   if(c&&(c.last_seen||0)>(S.last_seen||0)+2){
    const when=new Date(c.last_seen*1000).toLocaleString("en-GB");
    if(await ask([`This device has newer progress that never reached the cloud (saved ${when}).`],[["y","Use the newer progress"],["n","Use the cloud save"]])==="y"){S=Object.assign(DEFAULT(),c);dirty=true}
   }
  }catch(e){}
  shown=S.money;status=dirty?"saving":"saved";
  if(dirty)flush();
 }

  root().innerHTML=`<div class="authbox"><h1>🎰 Casino Simulator</h1><div class="loadmsg">Loading…</div></div>`;
  const m=await api("me");
  if(m.ok){user=m.d.username;root().remove();await loadSave(false);start();return}
  if(m.status===0||m.status>=500)return fatal(m.d.error||"Server error.");
  screen("login");
 }

 return{boot,queue,btn,menu,api,drain};
})();

/* ========== GLOBAL LEADERBOARD ========== */
const Board=(()=>{
 let data=null,loading=false,tab="peak",err="";
 const TABS=[["peak","💰 Most money ever"],["wagered","🎲 Most gambled"],["money","👛 Richest now"]];
 const BLURB={peak:"The highest balance you've ever reached.",wagered:"Total amount you've staked on every game, ever.",money:"Money in your pocket right now."};
 const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const medal=i=>["🥇","🥈","🥉"][i]||"#"+(i+1);
 function draw(){
  if(view.v!=="board")return;
  const a=$("app");
  const top=isLocked()?`<div class="top"><h1>Leaderboard</h1></div>`:head(["go('lobby')","Lobby"]);
  let body="";
  if(loading&&!data)body=`<div class="loadmsg">Loading the leaderboard…</div>`;
  else if(err&&!data)body=`<div class="lbnote">${esc(err)}</div>`;
  else if(data){
   const list=data.boards[tab]||[],you=data.you[tab];
   const inTop=list.some(x=>x.name===data.name);
   const rows=list.map((x,i)=>`<div class="lbrow ${x.name===data.name?"me":""}"><span class="rk">${medal(i)}</span><span class="nm">${esc(x.name)}${x.name===data.name?" (you)":""}</span><span class="vl">${fmt(x.value)}</span></div>`).join("");
   body=(data.hold?`<div class="lbnote">⏳ Your newest stats are <b>on hold</b>: they changed faster than the game allows, so they're not shown yet. Your save is safe, and they'll appear once your play history catches up.</div>`:"")
    +`<div class="lbl">${BLURB[tab]}</div>`
    +(you.rank&&inTop?"":you.rank?`<div class="lbrow me"><span class="rk">#${you.rank}</span><span class="nm">You${inTop?"":` · not in the top ${list.length}`}</span><span class="vl">${fmt(you.value)}</span></div>`:`<div class="lbl">You're not ranked here yet - go play!</div>`)
    +`<div class="lb">${rows||`<div class="lbl">Nobody is on this board yet.</div>`}</div>`
    +`<div class="lbl">${data.players} player${data.players===1?"":"s"} · top lists refresh about every 30 seconds</div>`;
  }
  a.innerHTML=top+`<h2>🏆 Global leaderboard</h2><div class="tabs">${TABS.map(([k,t])=>`<button class="btn ${k===tab?"on":""}" onclick="Board.tab('${k}')">${t}</button>`).join("")}</div>`+body
   +`<div class="row"><button class="btn" onclick="Board.load()" ${loading?"disabled":""}>${loading?"Refreshing…":"↻ Refresh"}</button>${isLocked()?`<button class="btn" onclick="go('stats')">Back</button>`:""}</div>`;
 }
 async function load(){
  if(loading)return;loading=true;err="";draw();
  await Auth.drain();
  const r=await Auth.api("leaderboard");
  loading=false;
  if(r.ok)data=r.d;else err=r.d.error||"Couldn't load the leaderboard.";
  draw();
 }
 return{render:draw,load,open(){go("board");load()},tab(k){tab=k;draw()}};
})();
window.startCasino=function(){Auth.boot()};

</script>
<script>
/* ========== QUIZ ENGINE (content lives in QUIZ_CONFIG at the top of the file) ========== */
(function(){
 const C=window.QUIZ_CONFIG;
 const norm=t=>String(t).trim().replace(/\s+/g," ").toUpperCase();
 const $g=id=>document.getElementById(id);
 const body=$g("gbody");
 let sub=null,i=0,score=0,picked=null,done=false,unlocked=false;
 document.title=C.appName;
 $g("gname").textContent=C.appName;
 if(!C.subjects.some(s=>s.questions.some(q=>q.unlock&&q.type==="text")))console.warn("No question has unlock:true, so the casino cannot be unlocked.");

 function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}

 function unlock(){
  if(unlocked)return;unlocked=true;
  document.title="Casino Simulator";
  const g=$g("gate");g.classList.add("out");
  setTimeout(()=>g.remove(),450);
  window.startCasino&&window.startCasino();
 }

 function menu(){
  sub=null;
  $g("gprog").textContent="";$g("gfill").style.width="0";
  body.replaceChildren(el("h2",null,"Choose a subject"));
  C.subjects.forEach(s=>{
   const n=s.questions.length;
   const b=el("button","gopt");
   b.append(el("span",null,s.name),el("span","gcount","  \u00b7  "+(n?n+" question"+(n===1?"":"s"):"coming soon")));
   b.disabled=!n;
   b.onclick=()=>{sub=s;i=0;score=0;show()};
   body.append(b);
  });
 }

 function nav(){
  const row=el("div","gsub");
  const back=el("button","glink","\u2190 Subjects");back.onclick=menu;
  row.append(back,el("span","gcount",sub.name));
  return row;
 }

 function show(){
  const qs=sub.questions;
  if(i>=qs.length){
   $g("gprog").textContent="Finished";$g("gfill").style.width="100%";
   const pct=score/qs.length;
   body.replaceChildren(nav(),el("h2",null,sub.name+": quiz complete"),el("div","gscore",score+" / "+qs.length),
    el("p",null,pct===1?"Perfect score, nice work!":pct>=.6?"Good effort. Have another go to improve.":"Keep revising and try again."));
   const act=el("div","gact"),again=el("button","gbtn","Try again"),other=el("button","glink","Choose another subject");
   again.onclick=()=>{i=0;score=0;show()};other.onclick=menu;
   act.append(again,other);body.append(act);
   return;
  }
  const q=qs[i];picked=null;done=false;
  $g("gprog").textContent="Question "+(i+1)+" of "+qs.length;
  $g("gfill").style.width=(i/qs.length*100)+"%";
  body.replaceChildren(nav(),el("h2",null,(i+1)+". "+q.q));
  if(q.type==="text"){
   const t=el("input");t.type="text";t.id="gtxt";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.placeholder="Type your answer";
   t.onkeydown=e=>{if(e.key==="Enter")check()};
   body.append(t);setTimeout(()=>t.focus(),0);
  }else{
   q.options.forEach((o,n)=>{
    const b=el("button","gopt",o);b.dataset.n=n;
    b.onclick=()=>{if(done)return;picked=n;body.querySelectorAll(".gopt").forEach(x=>x.classList.toggle("sel",x===b))};
    body.append(b);
   });
  }
  const act=el("div","gact"),chk=el("button","gbtn","Check answer");chk.id="gcheck";chk.onclick=check;
  act.append(chk);body.append(act,el("div",null));
  body.lastChild.id="gfb";
 }

 function feedback(ok,msg){
  const fb=$g("gfb");
  fb.className="gfb "+(ok?"ok":"bad");
  fb.textContent=msg;
  const b=$g("gcheck");
  b.textContent=i===sub.questions.length-1?"See results":"Next question";
  b.onclick=()=>{i++;show()};
 }

 function check(){
  if(done)return;
  const q=sub.questions[i];
  if(q.type==="text"){
   const t=$g("gtxt"),v=t.value;
   if(!v.trim())return;
   if(q.unlock&&norm(v)===norm(C.secret)){unlock();return}
   done=true;t.disabled=true;
   const ok=q.answers.some(a=>norm(a)===norm(v));
   if(ok)score++;
   feedback(ok,(ok?"Correct! ":"Not quite. ")+(q.explain||""));
  }else{
   if(picked===null)return;
   done=true;
   const ok=picked===q.correct;if(ok)score++;
   body.querySelectorAll(".gopt").forEach(b=>{
    b.disabled=true;
    if(+b.dataset.n===q.correct)b.classList.add("ok");
    else if(+b.dataset.n===picked)b.classList.add("bad");
   });
   feedback(ok,(ok?"Correct! ":"Not quite. ")+(q.explain||""));
  }
 }
 menu();
})();
</script>
</body>
